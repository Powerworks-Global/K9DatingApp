
# MVP deployment compose - runs the whole stack on a single Docker host.
# This is the simple path for launching, not the Kubernetes/Helm/operator
# setup described in ADR-006/011 for when you actually need to scale.
# Postgres, object storage, and auth are Supabase-managed (ADR-005/024) -
# nothing to run for those here.
#
# Manual usage (builds images locally on this box):
#   cp deploy/compose/.env.example deploy/compose/.env   # fill in real values
#   docker compose -f deploy/compose/docker-compose.prod.yml --env-file deploy/compose/.env up -d --build
#
# CD usage (.github/workflows/cd.yml): images are built and pushed to GHCR
# there, and this box only pulls - IMAGE_TAG/REGISTRY in .env pick which
# tag `docker compose pull` fetches. The `build:` blocks below stay for the
# manual path above; `image:` is what `pull` reads, one or the other wins
# depending on which compose subcommand you run.
#
# Caddy is the only container exposed to the host (80/443) - it terminates
# TLS (see Caddyfile) and reverse-proxies to the gateway over the internal
# Docker network. Api.Host and Blazor.App are reached through the gateway
# the same way, matching src/Gateway/K9Crush.Gateway/appsettings.json's
# existing cluster config (api-host:8080, blazor-app:8080) - service names
# below are chosen to match that file exactly, not arbitrarily.

services:
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - k9crush_caddy_data:/data
      - k9crush_caddy_config:/config
    depends_on:
      - gateway
    restart: unless-stopped

  gateway:
    image: ${REGISTRY:-ghcr.io/powerworks}/k9crush-gateway:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Gateway.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      - api-host
      - blazor-app
    restart: unless-stopped
    # No host port mapping - only caddy talks to this now, over the
    # internal Docker network (gateway:8080, per the Caddyfile).

  api-host:
    image: ${REGISTRY:-ghcr.io/powerworks}/k9crush-api-host:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/ApiHost.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Explicit (not just the appsettings.json default) so a stray
      # Auth__Provider=Local can never be inherited into a real deploy -
      # Api.Host also refuses to start with Local outside Development.
      Auth__Provider: Supabase
      ConnectionStrings__Postgres: ${SUPABASE_POSTGRES_CONNECTION_STRING}
      ConnectionStrings__RabbitMQ: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      ConnectionStrings__Redis: redis:6379
      Supabase__Url: ${SUPABASE_URL}
      Supabase__JwtSecret: ${SUPABASE_JWT_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # No host port mapping - only the gateway talks to this, over the
    # internal Docker network by service name (api-host:8080).

  blazor-app:
    image: ${REGISTRY:-ghcr.io/powerworks}/k9crush-blazor-app:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/BlazorApp.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Auth__Provider: Supabase
      ApiBaseUrl: http://api-host:8080
    depends_on:
      - api-host
    restart: unless-stopped
    # No host port mapping either - same reasoning as api-host above.

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      # Deliberately NOT guest/guest - that's fine for the throwaway local
      # dev compose file, not for anything labeled "production." Set real
      # values in your .env (see .env.example).
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - k9crush_rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - k9crush_redis_data:/data

volumes:
  k9crush_rabbitmq_data:
  k9crush_redis_data:
  k9crush_caddy_data:
  k9crush_caddy_config:
