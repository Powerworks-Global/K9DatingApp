
# Local dev infra only - the .NET apps (Api.Host, Gateway, Blazor.App) are
# NOT in here. Run those with `dotnet run` on your host so you get fast
# rebuild/debug cycles; they connect to these containers via localhost
# ports, matching src/Host/K9Crush.Api.Host/appsettings.Development.json.
#
# Usage: docker compose -f deploy/compose/docker-compose.yml up -d
#
# NOTE: Postgres and object storage used to be here (Postgres+PostGIS and
# MinIO containers), removed under ADR-024 in favor of Supabase-managed
# infra. The `postgres` service below is a DELIBERATE, TEMPORARY reversal
# of that decision for active slice build-out (fast local iteration, no
# network dependency, easy to wipe/reset) - Supabase Storage and Auth
# (ADR-005/024) are unaffected, only the ConnectionStrings:Postgres value.
# Revert to Supabase-managed Postgres before this project ships - see
# ADR-024 for the original reasoning that still applies at that point.

services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=k9crush
      - POSTGRES_PASSWORD=k9crush
      - POSTGRES_DB=k9crush
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k9crush"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI - http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bundles Grafana + Loki + Tempo + Mimir + an OTLP receiver in one image -
  # stands in for the full Alloy + separate-LGTM-components production
  # topology (ADR-010) so local dev needs zero extra setup. Runs with
  # local-disk storage, not Supabase Storage or any other object store -
  # see ADR-024 for why that decision was deliberately deferred rather
  # than assumed to just work.
  otel-lgtm:
    image: grafana/otel-lgtm
    ports:
      - "3000:3000"  # Grafana UI - http://localhost:3000 (admin/admin)
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    volumes:
      # WS4.4: default alerts tied to CONSTITUTION.md's Tier C SLOs (C1, C2).
      # Declared, not yet able to fire -- see the file's own header comment.
      - ../observability/alerts.yml:/otel-lgtm/grafana/conf/provisioning/alerting/alerts.yml:ro

  # Fake SMTP server for local dev - Notifications sends real emails here
  # instead of a real provider (SendGrid/Postmark, per the Inventory doc)
  # in every environment except production. Nothing gets actually
  # delivered; smtp4dev just captures it and shows it in a web inbox.
  smtp4dev:
    image: rnwood/smtp4dev:latest
    ports:
      - "5080:80"    # Web UI - http://localhost:5080
      - "2525:25"    # SMTP - point Notifications' dev SMTP config here

volumes:
  postgres-data:
